# Railway/Nixpacks — native deps for pdfjs canvas rasterization (node-canvas).
[phases.setup]
nixPkgs = ["nodejs_20", "python3", "pkg-config", "cairo", "pango", "libjpeg", "giflib", "librsvg"]
aptPkgs = ["build-essential", "libcairo2-dev", "libpango1.0-dev", "libjpeg-dev", "libgif-dev", "librsvg2-dev", "tesseract-ocr", "tesseract-ocr-eng"]

[phases.install]
cmds = ["npm ci || npm install"]

[start]
cmd = "node worker.js"
