<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>PEPCO New Service (test fixture)</title></head>
<body>
  <h1>PEPCO Electric New Service Application</h1>
  <form id="pepco-new-service-form">
    <label>Project address <input id="pepco-project-address" name="projectAddress" type="text" /></label>
    <label>Project type <input id="pepco-project-type" name="projectType" type="text" /></label>
    <label>Description <textarea id="pepco-project-description" name="projectDescription"></textarea></label>
    <label>Connected load <textarea id="pepco-connected-load" name="connectedLoad"></textarea></label>
    <label>Site plan <input name="sitePlan" type="file" /></label>
    <label>Single-line <input name="singleLineDiagram" type="file" /></label>
    <label>Cut sheets <input name="equipmentCutSheets" type="file" /></label>
    <label>LOA <input name="letterOfAuthorization" type="file" /></label>
    <button type="button" id="pepco-final-submit">Submit Application</button>
  </form>
</body>
</html>
