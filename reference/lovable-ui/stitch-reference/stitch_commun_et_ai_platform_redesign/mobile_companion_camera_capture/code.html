<style>
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            pointer-events: none;
            z-index: 20;
        }
        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background-color: #e8882f; /* primary-container */
        }
        .crosshair::before {
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
        }
        .crosshair::after {
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            transform: translateX(-50%);
        }
        
        .ar-grid {
            background-image: 
                linear-gradient(rgba(232, 136, 47, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(232, 136, 47, 0.3) 1px, transparent 1px);
            background-size: 33.33% 33.33%;
            pointer-events: none;
        }

        .level-line {
            transition: transform 0.1s ease-out;
        }
        
        /* Hide scrollbar for tag selector */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;

<script>
        // Simulate level indicator movement
        const levelLine = document.getElementById('levelIndicator');
        let angle = 2;
        
        setInterval(() => {
            // Slight random wobble between -3 and 3 degrees to simulate holding a phone
            angle = angle + (Math.random() - 0.5) * 1.5;
            if(angle > 3) angle = 3;
            if(angle < -3) angle = -3;
            
            levelLine.style.transform = `translateY(-50%) rotate(${angle}deg)`;
            
            // Turn green when close to level
            if(Math.abs(angle) < 0.5) {
                levelLine.classList.replace('bg-primary-container', 'bg-status-success');
                levelLine.style.boxShadow = '0 0 8px rgba(19,115,51,0.8)';
            } else {
                levelLine.classList.replace('bg-status-success', 'bg-primary-container');
                levelLine.style.boxShadow = '0 0 8px rgba(232,136,47,0.8)';
            }
        }, 200);
    </script>
