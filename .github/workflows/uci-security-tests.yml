name: UCI Security Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  uci-cross-tenant-security:
    name: Cross-tenant UCI security (Row 4 gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scraper-service/package-lock.json

      - name: Install scraper-service dependencies
        working-directory: scraper-service
        run: npm ci --ignore-scripts

      - name: Run UCI security test suite
        working-directory: scraper-service
        run: npm run test:uci:security

      - name: Install frontend deps for invitation logic tests
        run: npm ci

      - name: Run team invitation boundary tests
        run: npx tsx --test src/lib/projectTeamInvitationLogic.test.ts
